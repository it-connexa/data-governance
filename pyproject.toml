[project]
name = "dq-governance"
version = "0.1.0"
description = "Data Governance PoC — plain-English rules to deterministic Snowflake checks"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pyarrow>=17.0",
    "sqlglot>=25.0",
    "typer>=0.12",
    "duckdb>=1.5.5",
    "pytz>=2026.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
dq = "dq.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dq"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
