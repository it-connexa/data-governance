# =====================================================================
# Connexa Data Governance PoC — source definitions
# ---------------------------------------------------------------------
# Rule SQL never names Snowflake tables directly. It references logical
# sources as {{ src.NAME }}, and the engine renders each one as a
# filtered subquery, so the soft-delete filters can't be skipped:
#
#   FROM {{ src.SITE }} s
#   -> FROM (SELECT <columns> FROM <DB>.<SCHEMA>.<TABLE>
#            WHERE <default_filters> AND <filters>) s
#
# On migration to Snowflake, each entry becomes a real DQ_SRC view.
# Fill in <PLACEHOLDERS> during setup step 1.
#
# sf_object:    the Salesforce API name of the object (Object Manager), used only to build
#               the "open in Salesforce" link: <SF_BASE_URL>/lightning/r/<sf_object>/<id>/view.
#               If it, or SF_BASE_URL in DQ_CONFIG, is unset or still a <PLACEHOLDER>, no link
#               is built. These are Sitetracker's managed-package objects, so they carry the
#               sitetracker__ namespace; confirm against Object Manager if a link 404s.
#
# record_label: plural noun used in headline totals
#               ("of 1,546 sites, 45 exceptions").
#
# Optional per-source fields, for tables outside the file-level database and
# schema (e.g. the reporting layer):
#   database / schema   override the file-level snowflake.database / .schema
#   freshness_column    override the file-level freshness_column
#   check_freshness     false = no freshness check (table has no refresh timestamp)
#   grain               what one row is ("one row per project per milestone")
#   not_for             what to use a different source for. Together with
#                       `description`, this is how a rule author tells similar
#                       tables apart. `dq catalogue sources` prints them.
# =====================================================================

snowflake:
  database: RAW
  schema: TMP

# Applied to every source unless a source sets apply_default_filters: false
default_filters:
  - "COALESCE(_FIVETRAN_DELETED, FALSE) = FALSE"   # Fivetran soft deletes
  - "COALESCE(IS_DELETED, FALSE) = FALSE"          # Salesforce recycle bin

freshness_column: _FIVETRAN_SYNCED

sources:

  SITE:
    table: SITETRACKER_SITE_C
    sf_object: sitetracker__Site__c          # Salesforce API name, for record deep links
    record_label: sites
    description: Sitetracker site master (one row per cell site)
    columns: ["*"]                           # replace with explicit list once confirmed
    filters: []

  PROJECT:
    table: SITETRACKER_PROJECT_C
    sf_object: sitetracker__Project__c
    record_label: projects
    description: Sitetracker projects (build, upgrade, decommission etc.); links to site and template
    columns: ["*"]
    filters: []

  # Reporting layer. Milestones are the one place the raw tables are too awkward
  # (100+ wide forecast/actual column pairs, and some backend column names don't
  # match what Sitetracker shows, e.g. "Tower Installed Finished" is stored as
  # TOWER_INSTALL_START_*). The reporting table is unpivoted and carries the
  # front-end milestone names. SITE and PROJECT stay on the raw tables.
  # The raw wide tables (PROJECT_EXT_C, PROJECT_EXT_2_C) were retired as sources on
  # 2026-11-06 once MS-001 v4 moved here; add them back only with a good reason.
  #
  # Catalogue refreshed 2026-11-06 (21 columns): PROJECT_ID, PROJECT_TRAN_ID, SITE_ID,
  # SITE_NAME, PROJECT_TEMPLATE_NAME, MILESTONE_NAME, ACTUAL_DATE, FORECAST_DATE,
  # COMPLETION_DATE, COMPLETION_TYPE and some customer/programme/financial-year
  # columns. It has no _FIVETRAN_DELETED / IS_DELETED, no project name or status,
  # and no refresh timestamp, so the default filters and freshness check stay off.
  # Confirmed 2026-11-06: one row per project per milestone (row count equals
  # project count for every milestone). PROJECT_TRAN_ID is the Salesforce project ID
  # (joins to PROJECT.ID); PROJECT_ID is the project name. The view omits some
  # projects that exist in the raw tables (38 active New Site projects).
  # TODO: what COMPLETION_DATE / COMPLETION_TYPE mean, and fill in not_for.
  MILESTONES:
    database: PROD
    schema: REPORTING
    table: RPT_PROJECT_UNPIVOT_MILESTONES
    sf_object: sitetracker__Project__c         # a milestone rule's record is a project
    record_label: projects                   # a milestone rule's record is a project
    item_label: milestones
    description: >
      Unpivoted project milestones using the front-end (Sitetracker) milestone
      names. Rules filter on the milestone name instead of picking columns.
    grain: One row per project per milestone. PROJECT_TRAN_ID is the Salesforce project ID; PROJECT_ID is the project name
    not_for: ""                              # fill in once look-alike tables are known
    columns: ["*"]
    filters: []
    apply_default_filters: false
    check_freshness: false                   # refreshed daily; no timestamp column known yet

  # Reporting-layer projects: the business's own definition of which projects are
  # in scope to report on. Per Kevin, the view excludes test sites
  # (SITE_NAME_SEARCH LIKE '%TEST%') and limits templates to New Site,
  # Modification / Upgrade, Co-Location, Co-Location Old and Co-Lo Initial
  # Assessment. Catalogue read and checked 2026-11-06 (100 columns, 1,075 projects):
  # one row per project, and every row joins exactly one raw PROJECT by name.
  # It has no Salesforce ID, no template name and no refresh timestamp. Use it as
  # the scope list: JOIN {{ src.WIP_PROJECT }} w ON w.PROJECT_NAME = p.NAME.
  # The 70+ MILESTONE_nX / MILESTONE_nX_DATE columns are report layout; do not
  # read milestone dates from them.
  WIP_PROJECT:
    database: PROD
    schema: REPORTING
    table: RPT_WIP_PROJECT_DETAIL
    sf_object: sitetracker__Project__c
    record_label: projects
    description: >
      Reporting-layer projects, filtered to the projects the business reports on
      (no test sites; New Site, Modification / Upgrade and Co-Location templates).
    grain: >
      One row per project (project names are unique). PROJECT_COUNT and
      PROJECT_ROW_NUM number the projects on a site. No Salesforce ID, so join to
      PROJECT on PROJECT_NAME = NAME.
    not_for: >
      Milestone dates (use MILESTONES), record IDs or deep links (it has no
      Salesforce ID; take RECORD_ID from PROJECT), and anything about projects
      outside the reporting scope (use PROJECT).
    columns: ["*"]
    filters: []
    apply_default_filters: false
    check_freshness: false                   # refreshed daily; no timestamp column

  PROJECT_TEMPLATE:
    table: SITETRACKER_PROJECT_TEMPLATE_C
    sf_object: sitetracker__Project_Template__c
    record_label: templates
    description: Project templates; rules join on template name to scope milestone checks
    columns: ["*"]
    filters: []

